[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-order-bot"
version = "0.1.0"
description = "QQ Webhook order assistant with a persistent ledger and Excel reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "cryptography>=44,<51", "openpyxl>=3.1,<4", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "tzdata>=2025.1", "websockets>=15,<18"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
